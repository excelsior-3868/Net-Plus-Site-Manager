version: '3.8'

services:
  app:
    build:
      context: .
      args:
        - VITE_API_URL=http://${APP_DOMAIN}:8081
    container_name: netplus-manager
    restart: always
    ports:
      - "8081:5000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-5432}
      - PORT=5000
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
